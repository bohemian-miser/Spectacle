<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Spectacle</title>
    <meta name="description" content="A massively multiplayer strand-drawing game on hexagon and Spectre tilings." />
    <meta name="theme-color" content="#f7f8fa" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-1 -1 4 4'%3E%3Cpolygon points='0,0 1,0 1.5,0.866 1,1.732 0,1.732 -0.5,0.866' fill='%236ea8fe'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/styles.css" />
    <script>
      // Paint in the remembered theme, before the bundle loads. Mirrors
      // initialTheme() in theme.ts, which owns the key and the default.
      try {
        var t = new URLSearchParams(location.search).get('theme') || localStorage.getItem('spectacle.theme');
        document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
