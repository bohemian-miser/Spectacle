name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  smoke:
    name: Browser smoke (server + client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start the server and play a round headlessly
        run: |
          PORT=8787 BOTS=3 SEED=1 npm start > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8787/healthz >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8787/healthz
          npx tsx scripts/smoke.ts http://localhost:8787/ smoke.png
          npx tsx scripts/smoke.ts "http://localhost:8787/?solo" smoke-solo.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: |
            smoke*.png
            server.log
          retention-days: 7

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: spectacle:ci
          cache-from: type=gha
      - name: Container answers on /healthz
        run: |
          docker run -d --name spectacle -p 8787:8787 -e BOTS=1 spectacle:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8787/healthz && break
            sleep 1
          done
          curl -sf http://localhost:8787/healthz
          docker logs spectacle
