# When the repo owner comments on, or submits a review of, a PR the Gemini
# solver opened (label `agent:gemini`), wake the agent to answer or address
# it, push, and re-watch CI. Brief: .gemini/commands/address-comment.toml.
#
# Loop guard: the agent ends everything it posts with `<!-- gemini-agent -->`,
# and such comments never trigger a run. Only the owner's comments do, and
# only the owner's comments reach the agent: the thread is filtered here,
# outside the model, so nobody else's text can steer it.
#
# Same safety and config as gemini-issue-solver.yml: main must take a
# reviewed PR, a one-hour app token minted just before the agent starts,
# GEMINI_API_KEY, AGENT_APP_ID + AGENT_APP_PRIVATE_KEY.
name: Gemini PR comment responder

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: gemini-agent
  cancel-in-progress: false

jobs:
  respond:
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.issue.labels.*.name, 'agent:gemini') &&
       github.event.comment.user.login == github.repository_owner &&
       !contains(github.event.comment.body, '<!-- gemini-agent -->')) ||
      (github.event_name == 'pull_request_review' &&
       contains(github.event.pull_request.labels.*.name, 'agent:gemini') &&
       github.event.review.user.login == github.repository_owner &&
       github.event.review.state != 'approved')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: read
      pull-requests: read
    env:
      PR: ${{ github.event.issue.number || github.event.pull_request.number }}
    steps:
      - name: main takes reviewed pull requests only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/main" --jq '[.[] | select(.type == "pull_request") | .parameters.required_approving_review_count] | max // 0')
          if [ "${n:-0}" -lt 1 ]; then
            echo "::error::No ruleset makes main take a reviewed pull request (docs/feedback-agent.md, 'Setup')."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Gemini CLI, ripgrep, and Chromium for the smoke rounds
        run: |
          npm install -g @google/gemini-cli --silent
          sudo apt-get install -y --no-install-recommends ripgrep
          npx playwright install --with-deps chromium

      # The work queue: the owner's comments only (PR conversation, inline
      # review comments, review bodies), minus the agent's own.
      - name: Owner-only comment queue
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          mkdir -p .agent-input
          FILTER='[.[] | select(.user.login == env.OWNER) | select((.body // "") | contains("<!-- gemini-agent -->") | not) | select((.body // "") != "")]'
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments?per_page=100" --jq '.[]' | jq -s "$FILTER | map({id, created_at, body})" > .agent-input/pr-comments.json
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/comments?per_page=100" --jq '.[]' | jq -s "$FILTER | map({id, path, line, created_at, body})" > .agent-input/review-comments.json
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews?per_page=100" --jq '.[]' | jq -s "$FILTER | map({id, state, submitted_at, body})" > .agent-input/reviews.json
          echo "Owner comments queued: $(jq length .agent-input/pr-comments.json) on the PR, $(jq length .agent-input/review-comments.json) inline, $(jq length .agent-input/reviews.json) review bodies"

      - id: app
        if: vars.AGENT_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: Log the agent in
        env:
          TOKEN: ${{ steps.app.outputs.token }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::No agent token: set AGENT_APP_ID and AGENT_APP_PRIVATE_KEY (docs/feedback-agent.md)."
            exit 1
          fi
          printf '%s' "$TOKEN" | gh auth login --with-token
          gh auth setup-git
          git config --global user.name "gemini-agent"
          git config --global user.email "gemini-agent@users.noreply.github.com"

      - name: Address the feedback
        timeout-minutes: 50
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GEMINI_MODEL: gemini-3.1-pro-preview
        run: |
          set -o pipefail
          gemini --approval-mode=yolo -p "/address-comment $PR .agent-input" 2>&1 | tee "$RUNNER_TEMP/gemini-run.log"

      - name: Collect and scrub agent logs
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOKEN: ${{ steps.app.outputs.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/gemini-logs"
          cp "$RUNNER_TEMP/gemini-run.log" "$RUNNER_TEMP/gemini-logs/" 2>/dev/null || true
          cp -r "$HOME/.gemini/tmp" "$RUNNER_TEMP/gemini-logs/sessions" 2>/dev/null || true
          # Artifacts on a public repo can be downloaded: scrub credentials.
          find "$RUNNER_TEMP/gemini-logs" -type f | while read -r f; do
            for s in "$GEMINI_API_KEY" "$TOKEN"; do
              [ -n "$s" ] && sed -i "s|$s|***|g" "$f" || true
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gemini-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/gemini-logs/
          if-no-files-found: ignore
          retention-days: 30
