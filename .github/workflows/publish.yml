# Build the game image and push it to GitHub's container registry on every
# push to main, once that commit's CI has passed (wait-for-ci.yml; a manual
# run isn't gated). The VM (deploy/gcp) watches that image and redeploys
# itself, so this is a deploy too.
name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One at a time, and a newer push's run waits its turn (replacing an older
# one still waiting): waiting for CI makes finish times vary, and `latest`
# must end up on the newest commit, not on whichever CI finished last.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/wait-for-ci.yml
    permissions:
      actions: read

  publish:
    needs: ci
    if: needs.ci.outputs.passed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR image names must be lowercase; the action lowercases the repo.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
