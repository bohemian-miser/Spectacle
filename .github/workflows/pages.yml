# Static solo build on GitHub Pages: the whole game runs in the tab, no server.
# Enable Pages with source "GitHub Actions" once in the repo settings. Set the
# repository variable SPECTACLE_ONLINE_URL to link to the live arena.
name: Deploy solo build to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /Spectacle/
          VITE_SOLO_ONLY: '1'
          VITE_ONLINE_URL: ${{ vars.SPECTACLE_ONLINE_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
