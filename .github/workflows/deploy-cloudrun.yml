# Deploy the online arena to Cloud Run on every merge to main, once that
# commit's CI has passed (wait-for-ci.yml: a push whose CI fails deploys
# nothing; a manual run isn't gated).
# Needs the variables that deploy/gcp/setup-ci.sh prints; until GCP_PROJECT
# is set the job is skipped, so the workflow is harmless.
#
# Auth is Workload Identity Federation, not a service-account key: GitHub's
# OIDC token is exchanged for a short-lived GCP one, so no long-lived
# credential is ever stored here. The pool's attribute condition pins the
# trust to this repo, and `id-token: write` below is what lets Actions mint
# the OIDC token at all.
name: Deploy online arena to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudrun
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/wait-for-ci.yml
    permissions:
      actions: read

  # A push that changes nothing the servers run needs no deploy, which would
  # start fresh instances (every board reset) for nothing: agent briefs and
  # workflows (.github/, .gemini/; this file excepted), docs/, tests/,
  # scripts/ and top-level Markdown aren't in the image (the Dockerfile's
  # final stage holds dist/ built from client/ and shared/, plus shared/,
  # server/, tsconfig.json and package*.json). Nor is shared/game/brains/ once
  # hot brains are set up (GCP_BRAINS_BUCKET): the "Ship bot brains" workflow
  # hands those to the running servers. A manual run always deploys.
  #
  # "Changed" is measured from what is live: the commit of the newest
  # online-arena deployment that succeeded (the deploy job's `environment`
  # records one per deploy), not the push's `before`. A commit whose CI failed
  # or was cancelled isn't deployed, so `before` may never have gone out, and
  # a docs-only push after it would skip what it carried. Can't tell what is
  # live (no deployment, API error, commit not fetched): deploy.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    outputs:
      deploy: ${{ steps.diff.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          HOT: ${{ vars.GCP_BRAINS_BUCKET != '' }}
        run: |
          deploy=true
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            # Deployments come newest first, and so do each one's statuses.
            live=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=online-arena&per_page=50" \
                     --jq '.[] | "\(.id) \(.sha)"' |
                   while read -r id sha; do
                     state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" --jq '.[0].state')
                     if [ "$state" = success ]; then echo "$sha"; break; fi
                   done) || live=
            if [ -n "$live" ] && git cat-file -e "$live^{commit}" 2>/dev/null; then
              echo "Live: $live"
              outside='^(\.github/|\.gemini/|docs/|tests/|scripts/|[^/]+\.md$)'
              [ "$HOT" = true ] && outside='^(shared/game/brains/|\.github/|\.gemini/|docs/|tests/|scripts/|[^/]+\.md$)'
              files=$(git diff --name-only "$live" "$GITHUB_SHA")
              if ! echo "$files" | grep -Evq "$outside" && ! echo "$files" | grep -q '^\.github/workflows/deploy-cloudrun\.yml$'; then
                deploy=false
                echo "Nothing the servers run changed since $live (brains go live through Ship bot brains): no deploy."
              fi
            else
              echo "Can't tell which commit is live ('$live'): deploying."
            fi
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  # One image for every shard (shared/game/shard.ts): the free VM is shard
  # `a`, these are the rest, each its own one-instance service that scales to
  # zero — $0 until a surge spills onto it. SPECTACLE_SHARDS lists them (JSON;
  # default b–z, 25 × 400 players), in the order a full one hands joins on.
  # deploy/gcp/shard-domains.sh gives each its <name>.s.hexagon.rodeo once.
  image:
    needs: [ci, changes]
    if: vars.GCP_PROJECT != '' && needs.ci.outputs.passed == 'true' && needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/${{ vars.GCP_AR_REPO || 'spectacle' }}/spectacle
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: image
        run: echo "image=$IMAGE:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [image]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        shard: ${{ fromJSON(vars.SPECTACLE_SHARDS || '["b","c","d","e","f","g","h","i","j","k","l","m","n","o","p","q","r","s","t","u","v","w","x","y","z"]') }}
    environment:
      name: online-arena
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - id: next
        env:
          SHARDS: ${{ vars.SPECTACLE_SHARDS || '["b","c","d","e","f","g","h","i","j","k","l","m","n","o","p","q","r","s","t","u","v","w","x","y","z"]' }}
        run: echo "next=$(echo "$SHARDS" | jq -r --arg s '${{ matrix.shard }}' 'index($s) as $i | .[$i + 1] // ""')" >> "$GITHUB_OUTPUT"
      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: spectacle-${{ matrix.shard }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ needs.image.outputs.image }}
          # One instance each, so a shard is one process and its rooms are
          # exactly where its links say. concurrency is open sockets: a
          # little above MAX_INSTANCE_PLAYERS (lobby sockets count too), so
          # the cap refuses (and hands on to the next shard) before Cloud
          # Run would queue. cpu-boost speeds up a cold start's field build.
          # The probes restart an instance whose event loop is stuck: /health
          # runs on the game's loop, so a frozen process (a bot brain once
          # blocked one for minutes) stops answering. Startup: every 2 s for
          # up to 240 s (the port opens once the field is built). Liveness:
          # every 10 s, 5 s timeout, killed after 3 misses in a row.
          flags: >-
            --allow-unauthenticated
            --min-instances=0
            --max-instances=1
            --concurrency=${{ vars.SPECTACLE_CONCURRENCY || '500' }} --timeout=3600
            --cpu=1 --memory=${{ vars.SPECTACLE_MEMORY || '1Gi' }}
            --cpu-boost
            --startup-probe=httpGet.path=/health,periodSeconds=2,timeoutSeconds=1,failureThreshold=120
            --liveness-probe=httpGet.path=/health,periodSeconds=10,timeoutSeconds=5,failureThreshold=3
          env_vars: |
            SHARD=${{ matrix.shard }}
            SHARD_NEXT=${{ steps.next.outputs.next }}
            SHARD_WS=${{ vars.SPECTACLE_SHARD_WS || 'wss://{shard}.s.hexagon.rodeo/ws' }}
            BOTS=${{ vars.SPECTACLE_BOTS || '1' }}
            FIELD_FAMILY=${{ vars.SPECTACLE_FIELD_FAMILY || 'hex' }}
            FIELD_LEVEL=${{ vars.SPECTACLE_FIELD_LEVEL || '6' }}
            MAX_INSTANCE_PLAYERS=${{ vars.SPECTACLE_MAX_INSTANCE_PLAYERS || '400' }}
            BOTS_URL=${{ vars.GCP_BRAINS_BUCKET != '' && format('gs://{0}/brains', vars.GCP_BRAINS_BUCKET) || '' }}
            FEEDBACK_URL=${{ vars.GCP_FEEDBACK_BUCKET != '' && format('gs://{0}', vars.GCP_FEEDBACK_BUCKET) || '' }}
            WINS_FIRESTORE=${{ vars.GCP_PROJECT }}
            STATS_BIGQUERY=${{ vars.GCP_PROJECT }}.${{ vars.SPECTACLE_STATS_DATASET || 'spectacle' }}
      - run: echo "Shard ${{ matrix.shard }} deployed to ${{ steps.deploy.outputs.url }}"
