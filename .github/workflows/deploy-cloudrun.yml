# Deploy the online arena to Cloud Run on every merge to main.
# Needs the variables that deploy/gcp/setup-ci.sh prints; until GCP_PROJECT
# is set the job is skipped, so the workflow is harmless.
#
# Auth is Workload Identity Federation, not a service-account key: GitHub's
# OIDC token is exchanged for a short-lived GCP one, so no long-lived
# credential is ever stored here. The pool's attribute condition pins the
# trust to this repo, and `id-token: write` below is what lets Actions mint
# the OIDC token at all.
name: Deploy online arena to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudrun
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.GCP_PROJECT != ''
    runs-on: ubuntu-latest
    environment:
      name: online-arena
      url: ${{ steps.deploy.outputs.url }}
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/${{ vars.GCP_AR_REPO || 'spectacle' }}/spectacle
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: spectacle
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          flags: >-
            --allow-unauthenticated
            --min-instances=0 --max-instances=1
            --concurrency=1000 --timeout=3600
            --cpu=1 --memory=1Gi
            --session-affinity
          env_vars: |
            BOTS=${{ vars.SPECTACLE_BOTS || '1' }}
            FIELD_FAMILY=${{ vars.SPECTACLE_FIELD_FAMILY || 'hex' }}
            FIELD_LEVEL=${{ vars.SPECTACLE_FIELD_LEVEL || '6' }}
      - run: echo "Deployed to ${{ steps.deploy.outputs.url }}"
