# Deploy the online arena to Cloud Run on every merge to main.
# Needs the variables that deploy/gcp/setup-ci.sh prints; until GCP_PROJECT
# is set the job is skipped, so the workflow is harmless.
#
# Auth is Workload Identity Federation, not a service-account key: GitHub's
# OIDC token is exchanged for a short-lived GCP one, so no long-lived
# credential is ever stored here. The pool's attribute condition pins the
# trust to this repo, and `id-token: write` below is what lets Actions mint
# the OIDC token at all.
name: Deploy online arena to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudrun
  cancel-in-progress: false

jobs:
  # A push that changes nothing the servers run needs no deploy, which would
  # start fresh instances (every board reset) for nothing: agent briefs and
  # workflows (.github/, .gemini/; this file excepted), docs/ and top-level
  # Markdown aren't in the image. Nor is shared/game/brains/ once hot brains
  # are set up (GCP_BRAINS_BUCKET): the "Ship bot brains" workflow hands
  # those to the running servers. A manual run always deploys.
  changes:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.diff.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
          HOT: ${{ vars.GCP_BRAINS_BUCKET != '' }}
        run: |
          deploy=true
          if [ "$GITHUB_EVENT_NAME" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            outside='^(\.github/|\.gemini/|docs/|[^/]+\.md$)'
            [ "$HOT" = true ] && outside='^(shared/game/brains/|\.github/|\.gemini/|docs/|[^/]+\.md$)'
            files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
            if ! echo "$files" | grep -Evq "$outside" && ! echo "$files" | grep -q '^\.github/workflows/deploy-cloudrun\.yml$'; then
              deploy=false
              echo "Nothing the servers run changed (brains go live through Ship bot brains): no deploy."
            fi
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  deploy:
    needs: changes
    if: vars.GCP_PROJECT != '' && needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: online-arena
      url: ${{ steps.deploy.outputs.url }}
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/${{ vars.GCP_AR_REPO || 'spectacle' }}/spectacle
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: spectacle
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          # min-instances stays 0 by default (scale to zero, the point of Cloud
          # Run here) — set SPECTACLE_MIN_INSTANCES to keep one or more warm
          # ahead of expected traffic, trading idle cost for no cold start.
          # max-instances is what lets a surge actually scale out: each
          # instance is a self-contained pool of rooms (see server/index.ts's
          # "Scaling past one instance"), so raising it costs nothing while
          # idle and is safe to leave high. cpu-boost speeds up every cold
          # start's field build (README.md's "Scaling for a surge").
          # concurrency is open sockets per instance: a little above
          # MAX_INSTANCE_PLAYERS (lobby sockets count too), so Cloud Run
          # sends new connections elsewhere before the cap has to refuse them.
          flags: >-
            --allow-unauthenticated
            --min-instances=${{ vars.SPECTACLE_MIN_INSTANCES || '0' }}
            --max-instances=${{ vars.SPECTACLE_MAX_INSTANCES || '30' }}
            --concurrency=${{ vars.SPECTACLE_CONCURRENCY || '500' }} --timeout=3600
            --cpu=1 --memory=${{ vars.SPECTACLE_MEMORY || '1Gi' }}
            --cpu-boost
            --session-affinity
          env_vars: |
            BOTS=${{ vars.SPECTACLE_BOTS || '1' }}
            FIELD_FAMILY=${{ vars.SPECTACLE_FIELD_FAMILY || 'hex' }}
            FIELD_LEVEL=${{ vars.SPECTACLE_FIELD_LEVEL || '6' }}
            MAX_INSTANCE_PLAYERS=${{ vars.SPECTACLE_MAX_INSTANCE_PLAYERS || '400' }}
            BOTS_URL=${{ vars.GCP_BRAINS_BUCKET != '' && format('gs://{0}/brains', vars.GCP_BRAINS_BUCKET) || '' }}
            FEEDBACK_URL=${{ vars.GCP_FEEDBACK_BUCKET != '' && format('gs://{0}', vars.GCP_FEEDBACK_BUCKET) || '' }}
      - run: echo "Deployed to ${{ steps.deploy.outputs.url }}"
